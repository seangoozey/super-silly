# super-silly — THE compose file. Server-shaped by default so a forgotten
# flag can never silently boot a second, empty stack (that exact accident
# once looked like "all my data was wiped"): bare
#
#   docker compose up -d --build
#
# from this directory is a correct deployment. Data lives in BIND MOUNTS
# under SUPERSILLY_BASE (set it in .env — a real server wants a ZFS dataset
# for the free snapshots). Dev boxes add the override:
#
#   docker compose -f docker-compose.yml -f compose.dev.yml up -d --build
#
# which swaps to named volumes, the 12B model, and port 8001.
#
# GPU: needs nvidia-container-toolkit on the host
#   sudo apt install nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
# (Tesla P40 needs host driver branch 550+, the last Pascal branch.)
#
services:
  supersilly:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: supersilly:latest
    container_name: supersilly
    ports:
      - "${SUPERSILLY_PORT:-8000}:8000"
    environment:
      AUTOLIFE_BACKEND: ${AUTOLIFE_BACKEND:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/ReadyArt/Dark-Scarlett-27B-v2.0-GGUF:Q4_K_M}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-hf.co/ReadyArt/Dark-Desires-12B-v1.0-GGUF:Q4_K_M}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      AUTOLIFE_START_STOPPED: ${AUTOLIFE_START_STOPPED:-}
      SILLYTAVERN_BASICAUTHMODE: ${SILLYTAVERN_BASICAUTHMODE:-false}
      SILLYTAVERN_BASICAUTHUSER_USERNAME: ${SILLYTAVERN_BASICAUTHUSER_USERNAME:-}
      SILLYTAVERN_BASICAUTHUSER_PASSWORD: ${SILLYTAVERN_BASICAUTHUSER_PASSWORD:-}
    volumes:
      # ./server-data fallback is fine for a scratch test, WRONG for a real
      # server — set SUPERSILLY_BASE in .env
      - ${SUPERSILLY_BASE:-./server-data}/config:/home/node/app/config
      - ${SUPERSILLY_BASE:-./server-data}/data:/home/node/app/data
      - ${SUPERSILLY_BASE:-./server-data}/ollama:/root/.ollama
      - ${SUPERSILLY_BASE:-./server-data}/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      # NOTE: the port here is the CONTAINER-internal port (always 8000),
      # independent of SUPERSILLY_PORT (the host-side mapping). CMD-SHELL so
      # the basic-auth credentials (when enabled) are picked up from env —
      # without them an auth-enabled instance answers 401 and looks "unhealthy".
      test: ["CMD-SHELL", "curl -sf -u \"$${SILLYTAVERN_BASICAUTHUSER_USERNAME}:$${SILLYTAVERN_BASICAUTHUSER_PASSWORD}\" http://127.0.0.1:8000/api/plugins/autolife/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
