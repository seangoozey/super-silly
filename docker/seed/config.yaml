# super-silly seed config — SillyTavern's `npm run init` (server-init.js)
# fills in any keys not listed here.
listen: true
port: 8000
whitelistMode: false
basicAuthMode: false
# LAN appliance mode: ST refuses to start with listen:true and no auth
# unless this is set. Put the container behind a trusted network or add
# basicAuthMode before exposing it beyond your LAN.
securityOverride: true
enableServerPlugins: true
enableServerPluginsAutoUpdate: false
browserLaunch:
    enabled: false
dataRoot: ./data
ollama:
    keepAlive: -1
    batchSize: -1
